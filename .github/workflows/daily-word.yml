name: 🇩🇪 German Word of the Day

on:
  # ── Runs every day at 8:00 AM IST (02:30 UTC) ──
  schedule:
    - cron: '30 2 * * *'

  # ── Allow manual trigger from GitHub UI ──
  workflow_dispatch:
    inputs:
      level:
        description: 'Override CEFR level for this run (A1/A2/B1/B2/C1/C2)'
        required: false
        default: ''

jobs:
  post-word:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🖥️ Install Chromium dependencies (for Puppeteer)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            chromium-browser \
            libatk-bridge2.0-0 libatk1.0-0 libcups2 libdbus-1-3 \
            libgdk-pixbuf2.0-0 libgtk-3-0 libnspr4 libnss3 \
            libx11-xcb1 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🍪 Restore WhatsApp session
        run: |
          if [ -n "${{ secrets.WWEBJS_AUTH }}" ]; then
            echo "${{ secrets.WWEBJS_AUTH }}" | base64 -d > wwebjs_auth.tar.gz
            mkdir -p .wwebjs_auth
            tar -xzf wwebjs_auth.tar.gz -C .wwebjs_auth
            echo "✅ WhatsApp session restored."
          else
            echo "⚠️  No WWEBJS_AUTH secret. Run setup locally first!"
            exit 1
          fi

      - name: 🇩🇪 Post Word of the Day
        run: npm start
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Level from manual trigger input overrides the secret default
          CHANNEL_LEVEL: ${{ github.event.inputs.level || secrets.CHANNEL_LEVEL || 'A1' }}

      - name: 💾 Update WWEBJS_AUTH secret (session refresh)
        if: success()
        run: |
          if [ -d ".wwebjs_auth" ]; then
            tar -czf wwebjs_auth_new.tar.gz -C .wwebjs_auth .
            NEW_AUTH=$(base64 -w 0 wwebjs_auth_new.tar.gz)
            # Update the secret via GitHub API
            curl -s -X PATCH \
              -H "Authorization: token ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/secrets/WWEBJS_AUTH" \
              -d "{\"encrypted_value\":\"${NEW_AUTH}\"}" || echo "⚠️ Could not auto-update secret (needs repo admin access)"
          fi

      - name: 📝 Commit progress update
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/progress.json
          git diff --cached --quiet || git commit -m "chore: day $(cat data/progress.json | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"currentDay\"])') posted [skip ci]"
          git push
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
