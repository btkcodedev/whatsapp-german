name: Daily German Word

permissions:
  contents: read   # the job only reads the repo and calls external APIs; no write access needed

on:
  schedule:
    # Target trigger: 3:00 AM IST = 21:30 UTC (previous day).
    # GitHub's `schedule` event has consistently fired this repo's job
    # 4.5-6.5 hours late (observed: 07:00-08:30 UTC actual vs 02:30 UTC
    # configured, over 2+ weeks) - a platform-side scheduler delay, not a
    # bug in this file. This trigger time is shifted earlier specifically
    # to compensate, so delivery still lands around 8-9:30 AM IST. If the
    # delay pattern shifts, this will need re-tuning again.
    - cron: '30 21 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ffmpeg transcodes pronunciation audio to Ogg/Opus.
      # Present on ubuntu-latest already; this is just a safety net.
      - run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      # Piper: offline neural TTS fallback for words with no Wiktionary
      # recording. Non-fatal — if this step fails, the job still runs and
      # just skips the TTS fallback (Wiktionary audio and text are unaffected).
      - name: Cache Piper voice model + pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.piper
            ~/.cache/pip
          key: piper-de_DE-thorsten-medium-v1

      - name: Install Piper (offline TTS fallback)
        continue-on-error: true
        run: |
          pipx install piper-tts || pip install --user piper-tts
          test -f "$GITHUB_WORKSPACE/.piper/de_DE-thorsten-medium.onnx" \
            || python3 -m piper.download_voices de_DE-thorsten-medium --data-dir "$GITHUB_WORKSPACE/.piper"

      - run: npm ci

      - run: npm start
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_LEVEL: A1
          DM_NUMBER: ${{ secrets.DM_NUMBER }}       # optional: also DM the word to these numbers
          PIPER_DATA_DIR: ${{ github.workspace }}/.piper
