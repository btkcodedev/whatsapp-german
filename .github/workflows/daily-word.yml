name: 🇩🇪 German Word of the Day

on:
  # ── Runs every day at 8:00 AM IST (02:30 UTC) ──
  schedule:
    - cron: '30 2 * * *'

  # ── Allow manual trigger from GitHub UI ──
  workflow_dispatch:

jobs:
  post-word:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # We need write access to commit progress.json back
          token: ${{ secrets.GH_PAT }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🍪 Restore WhatsApp session
        run: |
          if [ -n "${{ secrets.WWEBJS_AUTH }}" ]; then
            echo "${{ secrets.WWEBJS_AUTH }}" | base64 -d > wwebjs_auth.tar.gz
            mkdir -p .wwebjs_auth
            tar -xzf wwebjs_auth.tar.gz -C .wwebjs_auth
            echo "✅ WhatsApp session restored."
          else
            echo "⚠️  No WWEBJS_AUTH secret found. Will attempt fresh login (QR needed)."
          fi

      - name: 🌍 Set CHANNEL_ID
        run: echo "CHANNEL_ID=${{ secrets.CHANNEL_ID }}" >> $GITHUB_ENV

      - name: 🇩🇪 Post Word of the Day
        run: npm start
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 💾 Save updated WhatsApp session
        if: always()
        run: |
          if [ -d ".wwebjs_auth" ]; then
            tar -czf wwebjs_auth.tar.gz -C .wwebjs_auth .
            echo "WWEBJS_AUTH=$(base64 -w 0 wwebjs_auth.tar.gz)" >> $GITHUB_ENV
            echo "✅ Session packaged."
          fi

      - name: 📝 Commit progress update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/progress.json
          git diff --cached --quiet || git commit -m "chore: advance to next word [skip ci]"
          git push
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
