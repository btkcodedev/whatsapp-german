name: 🇩🇪 German Word of the Day

on:
  schedule:
    # Runs every day at 8:00 AM IST (2:30 AM UTC)
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      level:
        description: 'Override CEFR level for this run (A1, A2, B1, B2, C1, C2)'
        required: false
        default: ''
        type: string

jobs:
  post-daily-word:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libxss1 \
            libasound2

      - name: 🔐 Restore WhatsApp session
        run: |
          mkdir -p .wwebjs_auth
          echo "${{ secrets.WWEBJS_AUTH }}" | base64 -d | tar -xzf - -C .wwebjs_auth

      - name: 📝 Set environment variables
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
          echo "CHANNEL_ID=${{ secrets.CHANNEL_ID }}" >> $GITHUB_ENV
          if [ -n "${{ github.event.inputs.level }}" ]; then
            echo "CHANNEL_LEVEL=${{ github.event.inputs.level }}" >> $GITHUB_ENV
          else
            echo "CHANNEL_LEVEL=${{ secrets.CHANNEL_LEVEL }}" >> $GITHUB_ENV
          fi

      - name: 🚀 Post daily word
        run: npm run start

      - name: 💾 Commit updated progress
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/progress.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📈 Daily word progress update - $(date -u +%Y-%m-%d)"
            git push
          fi