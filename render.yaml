services:
  # Main bot service - handles DM interactions AND daily channel posting
  # Session persists on disk, no need for WWEBJS_AUTH environment variable
  - type: web
    name: whatsapp-german-bot
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: CHANNEL_LEVEL
        value: A1
      - key: ENABLE_CRON
        value: "true"
    healthCheckPath: /health
    # CRITICAL: Persistent disk for WhatsApp session - this is how it really works
    disk:
      name: whatsapp-persistent-session
      mountPath: /app/.wwebjs_auth
      sizeGB: 1
